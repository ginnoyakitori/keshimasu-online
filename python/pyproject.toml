[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keshimasu-ai-python"
version = "0.1.0"
description = "Python/Numba/PyTorch core for Keshimasu AI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24.0",
    "numba>=0.59.0",
    "torch>=2.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]