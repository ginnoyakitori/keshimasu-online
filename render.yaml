services:
  - type: web
    name: kokumei-keshimasu
    runtime: node
    plan: free

    rootDir: keshimasu-online

    buildCommand: npm ci
    startCommand: npm start

    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PUZZLE_FILE
        value: ./data/puzzles/hard_puzzle_boards.json

      - key: COUNTRY_FILE
        value: ./data/words/countries.json

      - key: MATCH_DIR
        value: ./data/matches