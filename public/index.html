<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国名ケシマス対戦</title><link rel="stylesheet" href="/style.css"></head><body><main><section id="lobby" class="card"><h1>国名ケシマス対戦</h1><label>名前<input id="name" maxlength="20" value="プレイヤー"></label><div class="actions"><button id="create">部屋を作る</button></div><div class="join"><input id="roomCode" maxlength="6" placeholder="部屋コード"><button id="join">参加</button></div><p id="message"></p></section><section id="room" class="card hidden"><h2>部屋 <span id="roomId"></span></h2><div id="players"></div><button id="ready">準備OK</button><p id="roomStatus"></p></section><section id="game" class="hidden"><header><div>経過 <strong id="timer">0.000</strong>秒</div><div>相手 残り<strong id="opponentRemaining">40</strong></div></header><div id="countdown"></div><div id="board" aria-label="盤面"></div><div class="controls"><input id="word" placeholder="国名を入力" maxlength="10"><button id="submitMove">決定</button><button id="clearSelection" class="secondary">選択解除</button></div><p id="gameMessage"></p><div id="result" class="hidden"><h2 id="resultTitle"></h2><button id="rematch">再戦</button></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/client.js"></script></body></html>
